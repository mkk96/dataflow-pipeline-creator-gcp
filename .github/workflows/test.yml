name: Test

on:
  pull_request:
  workflow_call: # reused by deploy.yml: main only deploys when this passes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App — typecheck, lint, unit tests, build, generate samples
    runs-on: ubuntu-latest
    outputs:
      beam: ${{ steps.rt.outputs.beam }}
      python: ${{ steps.rt.outputs.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generate every scenario sample into generated/
        run: npm run generate
      - name: Read target runtime (src/config/runtime.ts)
        id: rt
        run: |
          rt=$(npx tsx scripts/print-runtime.ts)
          echo "beam=$(jq -r .beamVersion <<< "$rt")" >> "$GITHUB_OUTPUT"
          echo "python=$(jq -r .pythonVersion <<< "$rt")" >> "$GITHUB_OUTPUT"
          echo "$rt" | jq .
      - uses: actions/upload-artifact@v4
        with:
          name: generated-projects
          path: generated/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  generated:
    name: Generated projects — ruff, pytest (DirectRunner), run_local, metadata, shellcheck
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: generated-projects
          path: generated/
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.app.outputs.python }}
          cache: pip
          cache-dependency-path: generated/*/requirements*.txt

      - name: All projects pin the same dependencies
        run: |
          first=$(ls -d generated/*/ | head -1)
          for p in generated/*/; do
            diff <(grep -v '^#' "${first}requirements.txt") <(grep -v '^#' "${p}requirements.txt")
            diff <(grep -v '^#' "${first}requirements-dev.txt") <(grep -v '^#' "${p}requirements-dev.txt")
          done
          grep -q "apache-beam\[gcp\]==${{ needs.app.outputs.beam }}" "${first}requirements.txt"

      - name: pip install the generated requirements (+ checker tools)
        run: |
          first=$(ls -d generated/*/ | head -1)
          python -m pip install --upgrade pip
          (cd "$first" && pip install -r requirements-dev.txt)
          pip install jsonschema==4.25.1 yamllint==1.37.1
          python -c "import apache_beam; print('apache-beam', apache_beam.__version__)"

      - name: Install hadolint
        run: |
          curl -sSfL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version
          shellcheck --version | head -2

      - name: Check every generated project
        env:
          PYTHONWARNINGS: ignore
        run: bash scripts/check-generated.sh generated
